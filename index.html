<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKED BY JA7EEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cairo:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020804;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* خلفية الماتريكس المتحركة */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.45;
        }

        /* خطوط خضراء عمودية ضبابية في الخلفية كما في الصورة */
        .bg-streaks {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .streak {
            position: absolute;
            width: 18px;
            height: 140px;
            background: rgba(0, 255, 65, 0.35);
            filter: blur(14px);
            border-radius: 50%;
            animation: floatStreak 6s infinite alternate ease-in-out;
        }

        .s1 { top: 8%; right: 18%; height: 150px; }
        .s2 { top: 14%; right: 11%; height: 210px; animation-delay: 1s; }
        .s3 { bottom: 12%; left: 12%; height: 140px; animation-delay: 2s; }
        .s4 { bottom: 8%; left: 19%; height: 190px; animation-delay: 3s; }

        @keyframes floatStreak {
            0% { transform: translateY(-15px); opacity: 0.3; }
            100% { transform: translateY(15px); opacity: 0.75; }
        }

        /* الإطار الرئيسي المتوهج */
        .main-box {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 660px;
            background: rgba(3, 14, 6, 0.88);
            border: 1.5px solid #00ff41;
            border-radius: 10px;
            padding: 32px 26px 26px;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.25), inset 0 0 25px rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(4px);
        }

        /* خطوط الشاشة القديمة (Scanlines) */
        .main-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 255, 65, 0.04) 3px,
                rgba(0, 0, 0, 0.2) 4px
            );
            pointer-events: none;
            border-radius: 10px;
        }

        /* العنوان العلوي */
        .header-title {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 5px;
            color: #1aff53;
            text-shadow: 0 0 10px #00ff41, 0 0 22px #00cc33;
            margin-bottom: 18px;
        }

        /* الفاصل الأفقي مع أيقونة البرق */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
            box-shadow: 0 0 8px #00ff41;
        }

        .bolt-icon {
            font-size: 0.9rem;
            text-shadow: 0 0 8px #ffd700;
        }

        /* الصندوق الداخلي الأول */
        .inner-box-top {
            border: 1px solid rgba(0, 255, 65, 0.45);
            border-radius: 6px;
            padding: 16px 20px;
            background: rgba(0, 20, 6, 0.55);
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
            box-shadow: inset 0 0 12px rgba(0, 255, 65, 0.08);
        }

        .cursor-block {
            display: inline-block;
            width: 9px;
            height: 16px;
            background-color: #00ff41;
            box-shadow: 0 0 8px #00ff41;
            vertical-align: middle;
            margin-left: 4px;
            animation: blinkCursor 0.9s infinite;
        }

        @keyframes blinkCursor {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* الصندوق الداخلي الثاني الكبير */
        .inner-box-bottom {
            position: relative;
            border: 1px solid rgba(0, 255, 65, 0.65);
            border-radius: 8px;
            padding: 20px 22px;
            background: rgba(0, 18, 5, 0.65);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.12), inset 0 0 20px rgba(0, 255, 65, 0.08);
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        /* علامة مائية خفيفة في الخلفية داخل الصندوق */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-18deg);
            font-size: 5.5rem;
            font-weight: bold;
            color: rgba(0, 255, 65, 0.04);
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        .sub-heading {
            font-size: 1.05rem;
            letter-spacing: 2px;
            color: #4dff79;
            text-shadow: 0 0 6px rgba(0, 255, 65, 0.6);
        }

        .status-line {
            font-size: 0.88rem;
            color: #80ff9f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* شريط رابط الديسكورد */
        .discord-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        .star-icon {
            color: #ffcc00;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.7);
            font-size: 0.85rem;
        }

        .discord-pill {
            border: 1px solid #00ff41;
            border-radius: 20px;
            padding: 5px 18px;
            background: rgba(0, 35, 10, 0.7);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.25);
            transition: all 0.25s ease;
        }

        .discord-pill:hover {
            background: rgba(0, 255, 65, 0.18);
            box-shadow: 0 0 16px rgba(0, 255, 65, 0.6);
        }

        .discord-pill a {
            color: #33ff66;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* النص العربي السفلي */
        .arabic-footer {
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            color: #33ff66;
            text-shadow: 0 0 6px rgba(0, 255, 65, 0.5);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="bg-streaks">
        <div class="streak s1"></div>
        <div class="streak s2"></div>
        <div class="streak s3"></div>
        <div class="streak s4"></div>
    </div>

    <div class="main-box">
        <!-- العنوان الرئيسي -->
        <div class="header-title">HACKED BY ADOLF</div>

        <!-- الخط الفاصل وأيقونة البرق -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="bolt-icon">⚡</span>
            <div class="divider-line"></div>
        </div>

        <!-- الصندوق العلوي -->
        <div class="inner-box-top">
            <div>discord@es</div>
            <div>fuck@system-5 why?<span class="cursor-block"></span></div>
        </div>

        <!-- الصندوق السفلي -->
        <div class="inner-box-bottom">
            <div class="watermark">HACKED</div>

            <div class="sub-heading">✧ JA7EEM : ✧</div>
            <div class="status-line">good luck</div>
            <div class="status-line">2 🚨</div>
            <div class="status-line">3 🔥</div>

            <div class="discord-row">
                <span class="star-icon">★</span>
                <div class="discord-pill">
                    <a href="https://discord.gg/mMcKAvDeJM" target="_blank">discord.gg/mMcKAvDeJM</a>
                </div>
                <span class="star-icon">★</span>
            </div>

            <div class="arabic-footer">
                # النظام تحت السيطرة الكاملة #
            </div>
        </div>
    </div>

    <script>
        // كود خلفية الماتريكس الخضراء
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
        const fontSize = 14;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 8, 4, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 45);
    </script>

</body>
</html>
